[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeos-backend"
version = "1.0.0"
description = "ResumeOS - AI Resume Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "ResumeOS Team" }
]
keywords = [
    "fastapi",
    "resume",
    "ats",
    "ai",
    "job-matching",
    "openai",
    "postgresql"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License"
]

[tool.black]
line-length = 88
target-version = ["py313"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic",
    ".pytest_cache",
    ".mypy_cache"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "N",
    "W"
]

ignore = [
    "E501"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"

strict = true

warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true

check_untyped_defs = true

ignore_missing_imports = true

exclude = [
    "alembic",
    ".venv"
]

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

python_classes = [
    "Test*"
]

python_functions = [
    "test_*"
]

addopts = [
    "--strict-markers",
    "--disable-warnings",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing"
]

asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = [
    "app"
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]